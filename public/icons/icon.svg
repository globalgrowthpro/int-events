<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="230" r="140" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Center Badge / Shield -->
  <g filter="url(#shadow)">
    <!-- Hexagonal Tech Badge -->
    <path d="M 256 90 L 390 167 L 390 323 L 256 400 L 122 323 L 122 167 Z" 
          fill="#1E293B" 
          stroke="url(#primaryGrad)" 
          stroke-width="8" 
          stroke-linejoin="round" />
          
    <path d="M 256 114 L 368 178 L 368 310 L 256 374 L 144 310 L 144 178 Z" 
          fill="#0F172A" 
          opacity="0.8" />
  </g>

  <!-- Circuit / Connection Nodes -->
  <g stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="130" x2="256" y2="165" />
    <line x1="165" y1="300" x2="195" y2="280" />
    <line x1="347" y1="300" x2="317" y2="280" />
    <circle cx="256" cy="130" r="5" fill="#38BDF8" />
    <circle cx="165" cy="300" r="5" fill="#38BDF8" />
    <circle cx="347" cy="300" r="5" fill="#38BDF8" />
  </g>

  <!-- INT Modern Monogram Typography -->
  <!-- Letter I -->
  <path d="M 182 205 L 206 205 L 206 307 L 182 307 Z" fill="#FFFFFF" />
  <circle cx="194" cy="180" r="12" fill="url(#primaryGrad)" />

  <!-- Letter N -->
  <path d="M 226 205 L 246 205 L 282 278 L 282 205 L 302 205 L 302 307 L 282 307 L 246 234 L 246 307 L 226 307 Z" fill="#FFFFFF" />

  <!-- Letter T -->
  <path d="M 314 205 L 358 205 L 358 223 L 344 223 L 344 307 L 328 307 L 328 223 L 314 223 Z" fill="url(#primaryGrad)" />

  <!-- Bottom Brand Subtext -->
  <text x="256" y="446" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="5" 
        fill="#94A3B8">EVENTS</text>
</svg>
